[package]
name = "krishiv-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description.workspace = true
readme = "README.md"

[dependencies]
sha2 = { workspace = true }
arrow = { workspace = true }
rayon = { workspace = true }
tokio = { workspace = true, features = ["time", "sync"] }
tracing = { workspace = true }
thiserror = { workspace = true }

# posix_fadvise, for dropping the page cache behind write-once shuffle/spill
# files. See `page_cache` — under cgroup v2 that cache is charged to the
# container limit, and it was consuming ~30% of the executor budget. rustix
# rather than raw libc because the workspace denies `unsafe_code`.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[features]
chaos = []

[lints]
workspace = true
