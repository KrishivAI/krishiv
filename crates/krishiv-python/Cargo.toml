[package]
name = "krishiv-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "krishiv_python"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
krishiv-api = { path = "../krishiv-api", version = "0.1.0" }
krishiv-delta = { path = "../krishiv-delta", version = "0.1.0" }
krishiv-ivm = { path = "../krishiv-ivm", version = "0.1.0" }
krishiv-runtime = { path = "../krishiv-runtime", version = "0.1.0" }
krishiv-common = { path = "../krishiv-common", version = "0.1.0" }
# Only `lakehouse` is a base dependency of the bindings. kafka / iceberg /
# schema-registry / vector-sinks were pinned here too, which made the `kafka`,
# `iceberg` and `vector-sinks` features below no-ops for the dependency they
# claim to gate — every wheel built librdkafka whether or not it was asked for.
krishiv-connectors = { path = "../krishiv-connectors", version = "0.1.0", features = ["lakehouse"] }
krishiv-dataflow = { path = "../krishiv-dataflow", version = "0.1.0" }
krishiv-sql = { path = "../krishiv-sql", version = "0.1.0" }
krishiv-state = { path = "../krishiv-state", version = "0.1.0" }
krishiv-metrics = { path = "../krishiv-metrics", version = "0.1.0" }
krishiv-plan = { path = "../krishiv-plan", version = "0.1.0" }
# `ffi` powers the Arrow PyCapsule stream interface (`__arrow_c_stream__`) on
# QueryResult — the zero-copy handoff pyarrow / Polars / DuckDB negotiate
# through. Enabled here rather than workspace-wide: this leaf crate is the only
# consumer, so the C-ABI surface stays out of the engine's build graph.
arrow = { workspace = true, features = ["ffi"] }
parquet = { workspace = true }
pyo3 = { workspace = true }
# B-1 fix: turn `sql_async` into a real Python awaitable (not a blocking
# method dressed up as one). `pyo3-async-runtimes` bridges the Rust async runtime
# (tokio, the only one we ship) to Python's asyncio event loop.
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
tokio = { workspace = true }
futures.workspace = true
jsonwebtoken.workspace = true
serde_json.workspace = true
constant_time_eq.workspace = true
serde = { workspace = true }
tracing = { workspace = true }

[features]
default = []
extension-module = ["pyo3/extension-module"]
kafka = ["krishiv-connectors/kafka", "krishiv-api/kafka"]
# Confluent Schema Registry config objects. Pulls apache-avro + prost + reqwest,
# so it is opt-in: the wheel used to build all three unconditionally for a
# config struct the docs describe as not yet consumed by any source or sink.
schema-registry = ["krishiv-connectors/schema-registry"]
iceberg = ["krishiv-connectors/iceberg", "krishiv-api/iceberg-sink"]
# Cloud object-store backends (S3/MinIO, GCS, Azure) — required for Iceberg
# tables and other sinks whose `path` is an `s3://` URI.
cloud = ["krishiv-connectors/cloud", "krishiv-runtime/cloud"]
jdbc = ["krishiv-connectors/jdbc"]
kinesis = ["krishiv-connectors/kinesis"]
pulsar = ["krishiv-connectors/pulsar-source"]
cassandra = ["krishiv-connectors/cassandra"]
elasticsearch = ["krishiv-connectors/elasticsearch"]
hbase = ["krishiv-connectors/hbase"]
# `vector-sinks` is the flag; `ai` is the name the Python extra uses for it.
# They previously each named the leaf edge, so the pair read as two features.
vector-sinks = ["krishiv-connectors/vector-sinks"]
ai = ["vector-sinks"]
qdrant = ["vector-sinks", "krishiv-connectors/qdrant"]
pgvector = ["vector-sinks", "krishiv-connectors/pgvector"]

[lints]
workspace = true
