[package]
name = "krishiv-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description.workspace = true
readme = "README.md"

[dependencies]
arrow = { workspace = true }
prost.workspace = true
serde = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
thiserror = { workspace = true }
tonic.workspace = true
tracing = { workspace = true }
tonic-prost.workspace = true

[features]
serde = ["dep:serde", "dep:base64"]

[build-dependencies]
prost-build.workspace = true
protoc-bin-vendored.workspace = true
tonic-prost-build.workspace = true

# cargo-machete cannot see generated code: `prost` / `tonic-prost` are used by
# the `include!`d protobuf output, and the build-dependencies by build.rs
# (`protoc_bin_vendored::protoc_bin_path`, `prost_build::Config`,
# `tonic_prost_build::configure`).
[package.metadata.cargo-machete]
ignored = ["prost", "tonic-prost", "prost-build", "protoc-bin-vendored", "tonic-prost-build"]

[lib]
path = "src/lib.rs"

[lints]
workspace = true
