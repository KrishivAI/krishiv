[package]
name = "krishiv-connectors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description.workspace = true
readme = "README.md"

[lib]
path = "src/lib.rs"

[features]
# Parquet and CSV are the unconditional base: every build has them, there is
# no code behind a `parquet` flag to switch off. It used to be declared and
# sat in `default`, gating zero `#[cfg]` sites — so `--no-default-features`
# removed nothing while reading as a lean-baseline switch. Object-store
# backends (S3/GCS/Azure) are gated by `cloud`; there is no `s3` feature.
default = []

two-phase = []
# E6.1: Avro file source and sink
avro = ["dep:apache-avro"]

# Streaming
kafka = ["dep:rdkafka"]
schema-registry = [
    "kafka",
    "dep:apache-avro",
    "dep:async-trait",
    "dep:dashmap",
    "dep:reqwest",
    "dep:serde",
    "dep:prost",
]
state = ["dep:krishiv-state"]

# Lakehouse table formats (implementation in `crate::lakehouse`)
lakehouse = ["dep:async-trait", "dep:chrono", "dep:serde", "dep:tempfile", "dep:url"]
iceberg = ["lakehouse", "dep:iceberg", "dep:uuid", "dep:datafusion", "dep:typetag"]
# There is no `delta` or `hudi` feature. Both were `= ["lakehouse"]`, adding no
# dependency of their own, and `mod delta_lake` / `mod local_delta` / `mod hudi`
# were never gated — so 4.2k lines shipped in every `lakehouse` build while the
# flags gated only their certification suites, which therefore never ran. The
# formats now ship with `lakehouse` and are certified with it.

# Vector sinks (migrated from `krishiv-ai::vector_sinks`)
vector-sinks = [
    "dep:async-trait",
    "dep:dashmap",
    "dep:reqwest",
    "dep:serde",
]
qdrant = ["vector-sinks", "dep:qdrant-client"]
pgvector = ["vector-sinks", "dep:sqlx"]

# Deployment presets live on the `krishiv` binary and nowhere else. This crate
# used to carry `local` / `full` / `extended` too — same words, different
# capability sets, neither a superset of the binary's — so `--features full`
# meant one thing here and another one level up. Nothing referenced them.
#
# Gates the `exactly_once_integration` test target only (see [[test]] below),
# which is why it is named for a test rather than a capability.
exactly-once-integration = ["iceberg"]
# E6.4: AWS Kinesis streaming source
kinesis = ["dep:aws-sdk-kinesis", "dep:aws-config"]
# E6.5: Apache Pulsar streaming source
pulsar-source = ["dep:pulsar"]
# E6.6: Elasticsearch/OpenSearch sink
elasticsearch = ["dep:elasticsearch", "dep:url"]
# E6.8: Apache Cassandra / ScyllaDB sink
cassandra = ["dep:scylla"]
# E6.7: Apache HBase connector
hbase = ["dep:hbase-thrift", "dep:thrift"]
# T9: JDBC source/sink (Postgres in this build; MySQL requires adding the
# mysql feature to the workspace sqlx dep)
jdbc = ["dep:sqlx"]
# Vortex columnar format: zero-copy Arrow reads, filter/projection pushdown.
vortex = ["dep:vortex"]
# Cloud object-store backends (S3, GCS, Azure). Enables `object_store` cloud features.
cloud = ["object_store/aws", "object_store/gcp", "object_store/azure"]

[dependencies]
arrow = { workspace = true }
parquet = { workspace = true, features = ["object_store", "async"] }
bytes = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
krishiv-common = { path = "../krishiv-common", version = "0.1.0" }
krishiv-metrics = { path = "../krishiv-metrics", version = "0.1.0" }
krishiv-proto = { path = "../krishiv-proto", version = "0.1.0" }
chrono = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
url = { workspace = true, optional = true }
iceberg = { workspace = true, optional = true }
datafusion = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
krishiv-state = { path = "../krishiv-state", version = "0.1.0", optional = true }
object_store = { workspace = true }
rdkafka = { version = "0.39", optional = true, default-features = false, features = ["tokio"] }
regex = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
tracing = { workspace = true }

# schema-registry feature dependencies
apache-avro = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
# Iceberg's `Storage`/`StorageFactory` traits are `#[typetag::serde]`; the
# object-store-backed bridge (object_store_io) implements them.
typetag = { version = "0.2", optional = true }
dashmap = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json"], optional = true }
serde = { workspace = true, optional = true }
prost = { workspace = true, optional = true }

# vector-sinks feature dependencies
qdrant-client = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
# Drop the SDK's legacy `rustls` feature: it maps to aws-smithy-runtime/tls-rustls,
# a hyper-0.14-era connector pinned to rustls 0.21 -> rustls-webpki 0.101.7
# (GHSA-82j2-j2ch-gfr8, high). `default-https-client` already gives the modern
# rustls-aws-lc (0.23 -> webpki 0.103) path, so selecting it minus `rustls`
# yields modern-TLS-only and removes the vulnerable 0.101.7 from the graph.
aws-sdk-kinesis = { version = "1.109.0", optional = true, default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-config = { version = "1.8.18", optional = true }
pulsar = { version = "6.8.0", optional = true }
elasticsearch = { version = "9.1.0-alpha.1", optional = true }
scylla = { version = "1.7.0", optional = true }
hbase-thrift = { version = "1.2.0", optional = true }
thrift = { version = "0.17", optional = true }
# Vortex feature dependencies
vortex = { workspace = true, optional = true }

[[test]]
name = "exactly_once"
path = "tests/exactly_once.rs"
required-features = ["exactly-once-integration"]

[[test]]
name = "integration_connector_lakehouse"
path = "tests/integration_connector_lakehouse.rs"
required-features = ["lakehouse", "iceberg"]

[lints]
workspace = true
