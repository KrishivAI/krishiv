apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: krishiv-controller
  labels:
    app.kubernetes.io/name: krishiv
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/part-of: krishiv
# Least privilege: exactly the verbs the operator's code issues. It is a
# ClusterRole because `--all-namespaces` watches KrishivJobs (and places their
# executor pods) in every namespace. Nothing beyond these three resource
# groups is granted.
rules:
  - apiGroups:
      - krishiv.io
    resources:
      - krishivjobs
      - krishivjobs/status
    verbs:
      - get
      - list
      - watch
      - patch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - create
      - delete
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: krishiv-controller
  labels:
    app.kubernetes.io/name: krishiv
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/part-of: krishiv
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: krishiv-controller
subjects:
  - kind: ServiceAccount
    name: krishiv-controller
    namespace: krishiv-system
