# Phase 51 async-hygiene: sync-over-async bridging is policed by lint, not
# convention. `async_util::block_on` may only be called from deliberate
# sync-surface boundary modules (blocking API wrappers, CLI commands, pyo3
# bindings, sync-trait-over-async-client adapters) — those files carry a
# `#![allow(clippy::disallowed_methods)]` with a justification. Everything
# else must stay async end-to-end. Threading contract:
# docs/architecture/17-testing-and-quality.md
disallowed-methods = [
  { path = "krishiv_common::async_util::block_on", reason = "sync-over-async bridge: only allow-listed boundary modules may call this; async code must await instead (docs/architecture/17-testing-and-quality.md)" },
  # The rule above only policed the *helper*. Four sites hand-rolled the bridge
  # with a raw `block_in_place` instead and so were policed by nothing:
  # `IcebergCatalogBridge` (every CatalogProvider method), RocksDB
  # `snapshot_async`/`load_snapshot_async`, and the DUR-1 sink publish path.
  # `block_in_place` panics outright on a current-thread runtime, so each was a
  # latent abort rather than a style question. Route blocking-work-from-async
  # through `async_util::run_blocking`, which picks the right strategy per
  # runtime flavor.
  { path = "tokio::task::block_in_place", reason = "panics on a current-thread runtime: use krishiv_common::async_util::run_blocking (blocking work from async) or async_util::block_on (driving a future from sync) (docs/architecture/17-testing-and-quality.md)" },
]

# The workspace denies unwrap/expect/panic/indexing_slicing (Cargo.toml
# [workspace.lints.clippy]) because each one is a runtime panic in a daemon.
# In a test, a panic is the *reporting mechanism* — `unwrap()` on a value the
# test just constructed is how a failure is signalled, and rewriting it into
# error handling makes tests longer and worse at their job.
#
# Until now the two were reconciled by never linting test code at all: `just
# lint` ran without `--all-targets`, so every `#[cfg(test)]` module in the
# workspace was invisible to clippy. That silence was not a policy, it was a
# gap — it also hid genuine defects in test code, and it meant a contributor
# adding a test could not be told anything by the linter.
#
# These options say the same thing deliberately: panic-shaped lints are for
# production code, and everything else applies everywhere. `just lint` now
# passes `--all-targets`, so tests are linted for real.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = false
