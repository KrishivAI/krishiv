resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "Apache-2.0"
description = "Krishiv — hybrid batch and streaming compute engine"
documentation = "https://docs.rs/krishiv/latest/krishiv/"
homepage = "https://krishiv.ai"
repository = "https://github.com/KrishivAI/krishiv"
readme = "README.md"
keywords = ["arrow", "datafusion", "streaming", "sql", "dataflow"]
categories = ["database", "data-structures", "asynchronous"]

[workspace.dependencies]
# ── Arrow / DataFusion: pinned as a set, and NOT to the latest release ───────
#
# Latest is DataFusion 55 + arrow 59. We are held at 54.1 + 58.4 because
# `iceberg` pins `arrow-* ^58` and `parquet ^58` — released 0.10.1 *and*
# iceberg-rust `main`, so a git dependency is no escape either. On arrow 59 the
# lakehouse bridge stops compiling with "expected `arrow::array::RecordBatch`,
# found `arrow_array::record_batch::RecordBatch`": iceberg hands back a
# different Rust type than DataFusion accepts. Everything outside
# `krishiv-connectors/src/lakehouse/` migrates cleanly — the finished DF55 work
# is kept at docs/implementation/patches/datafusion-55-arrow-59-migration.patch.
#
# 58.4 is what iceberg-rust main uses, so this pin tracks them exactly.
# Re-attempt when iceberg publishes an arrow-59 release; see register §85.
arrow = { version = "58.4.0", features = ["prettyprint", "ipc_compression", "csv", "json"] }
arrow-flight = { version = "58.4.0", features = ["flight-sql-experimental"] }
pyo3 = { version = "0.29.2", features = ["experimental-async"] }
iceberg = "0.10.1"
iceberg-catalog-rest = "0.10.1"
async-trait = "0.1"
bytes = "1"
object_store = "0.13.2"
askama = "0.16.0"
axum = "0.8.9"
datafusion = "54.1.0"
datafusion-proto = "54.1.0"
# Higher-order array functions (array_transform/filter/any_match) that the
# Spark-parity HOF layer (transform/filter/exists/forall) delegates to for
# exact semantics. Pinned to the datafusion 54 train.
datafusion-functions-nested = "54.1.0"
futures = "0.3"
k8s-openapi = { version = "0.28", features = ["v1_33"] }
kube = { version = "4.2", features = ["runtime"] }
parquet = "58.4.0"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
prost = "0.14.4"
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"
tokio = { version = "1.53.1", features = ["fs", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = { version = "0.14.6", features = ["transport", "tls-ring"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tower = "0.5.3"
http = "1"
# jsonwebtoken 10 dropped its bundled `ring` backend and requires an explicit
# crypto provider. We add `aws_lc_rs` — the same backend the workspace's rustls
# TLS stack already uses — so the whole binary verifies signatures through one
# provider. Without a backend feature, decode() compiles but PANICS at runtime
# on the first asymmetric verify ("could not determine the process-level
# CryptoProvider"). Default features (use_pem) stay on: `from_jwk`/`from_ec_pem`
# need simple_asn1, which is gated behind use_pem.
jsonwebtoken = { version = "11.0", features = ["aws_lc_rs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-opentelemetry = "0.33.0"
opentelemetry = { version = "0.32.0", features = ["trace"] }
opentelemetry_sdk = { version = "0.32.1", features = ["trace"] }
opentelemetry-stdout = { version = "0.32.0", features = ["trace"] }
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic"] }
rocksdb = { version = "0.25.0", features = ["multi-threaded-cf"] }
mockito = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "blocking"] }
webpki-root-certs = "1.0"
uuid = { version = "1", features = ["v4"] }
lz4_flex = "0.14"
twox-hash = "2.1"
zstd = "0.13"
thiserror = "2"
ahash = "0.8"
# Held at 6.x on purpose: the only newer publish is 7.0.0-rc2, a release
# candidate. "Latest" should not mean shipping an RC in the concurrency layer.
dashmap = "6.1"
krishiv-delta = { path = "crates/krishiv-delta" }
qdrant-client = "1.19"
# sqlx 0.9 split the old combined `runtime-tokio-rustls` into a runtime feature
# and a TLS feature. `tls-rustls-ring` is the like-for-like replacement: 0.8's
# combined flag used ring, and a bump should not quietly move the Postgres
# driver onto a different crypto backend. (Both ring and aws-lc-rs are already
# in the tree — aws-lc-rs via jsonwebtoken — and nothing installs a rustls
# CryptoProvider explicitly; that predates this change and is left alone here.)
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "json"] }

base64 = "0.23"
rust-embed = "8"
mime_guess = "2"
constant_time_eq = "0.6"
indexmap = "2"
hex = "0.4"
apache-avro = "0.22"
chrono = { version = "0.4", features = ["serde"] }
proptest = "1"
regex = "1"
sqlparser = "0.62.0"
url = "2"
urlencoding = "2.1"
wiremock = "0.6"
# 0.38.4, not 0.39.6. The whole 0.39 line declares `rust-version = "1.95"` and
# this workspace publishes `rust-version = "1.94.1"`. Raising the toolchain is
# an MSRV decision with downstream consequences, not a side effect of a
# dependency bump — so this takes the newest release that honours the MSRV we
# advertise. Revisit together with the toolchain.
sysinfo = "0.38.4"
# 0.84.0, not 0.85.0 — the same MSRV wall as sysinfo: 0.85 declares
# `rust-version = "1.95"` and this workspace publishes 1.94.1. Only surfaced
# under `--all-features`, since vortex is an optional connector.
vortex = { version = "0.84.0", features = ["files", "tokio"] }
# Production allocator for server binaries. Reduces allocator contention 2-4x
# on multi-threaded workloads and cuts peak RSS 10-20% vs the system allocator.
# unprefixed_malloc_on_supported_platforms replaces malloc/free globally so
# native extensions (DataFusion C++ code paths) also benefit.
tikv-jemallocator = { version = "0.7", features = ["unprefixed_malloc_on_supported_platforms"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Deny unwrap/expect/panic workspace-wide. All violations have been
# resolved with proper error handling; new code must not regress.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Runtime-panic equivalents — same risk class as panic/unwrap.
todo = "deny"
unimplemented = "deny"

# Debug artifacts must not survive commit.
dbg_macro = "deny"

# Daemon process must use tracing, not stdout/stderr.
print_stdout = "deny"
print_stderr = "deny"

# Readability: wildcard imports obscure symbol origins.
wildcard_imports = "deny"

# OOB indexing panics at runtime — use .get() with error handling.
indexing_slicing = "deny"

# Async correctness: holding a lock/refcell borrow across .await risks
# deadlock or panic on the executor thread.
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"


[profile.dev]
opt-level = 0
debug = 0
# Incremental is OFF deliberately: the global rustc-wrapper is sccache,
# which cannot cache incremental compiles — with it on we paid wrapper
# overhead AND the incremental dep-graph's memory (the multi-GB straw on
# krishiv-executor's monomorphization-heavy compile) for zero caching.
# Non-incremental, sccache caches at crate granularity: an unchanged
# crate is a hit, a changed one recompiles whole — the right trade on a
# workspace whose giants OOM 23GB boxes. (First build after this flip
# recompiles everything once while populating the cache.)
incremental = false
split-debuginfo = "unpacked"

# dev: non-optimized, fastest possible compile. opt-level 0 for every
# crate (including workspace code). Debug=0 keeps artifacts small.
# Trade-off: tests of our own code and of datafusion/arrow/parquet run
# ~10-100x slower than opt-level 3. Use this for fast iteration only.
# Use the `release` profile for benchmarks and CI build verification.
[profile.dev.package."*"]
opt-level = 0
debug = 0

# release: highly optimized for production / CI. Thin LTO performs
# cross-crate inlining on the datafusion → arrow → krishiv hot path
# without the peak RAM of fat LTO (fat LTO OOMs on arm64 Docker builds).
# codegen-units=1 unlocks inlining across module boundaries.
# panic=abort removes all unwinding infrastructure (~5% size reduction,
# minor speed boost). strip="symbols" gives the smallest binary.
# UPX compression in the Dockerfiles provides the bulk of the size
# reduction (50-65%), making fat LTO's marginal 5-15% not worth the
# OOM risk.
#
# Compile cost: 3-5x longer than `dev`. Acceptable for CI jobs (where
# correctness > wall-clock) and release builds. Do NOT use for local
# iteration; use the default `dev` profile instead.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
